<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>secret form</title><style id="hostile"></style></head>
<body>
<!--
  A login page for the vault tests (tests/test_secret_*.py, test_wave6_vault.py).

  `fill --use-secret` refuses to write into a document the caller already ran
  `eval` / `content` in, and `value` / `eval` are refused while the secret is
  in a field. So the page is built from this static file, configured by the
  query string, and it reports what landed in its fields itself: clicking
  #probe writes a JSON snapshot into document.title and #out (read back with
  the `title` / `text` verbs). That is the site's own script, which sees the
  value on any real login page anyway.

  Query parameters:
    field=input|textarea|select|checkbox|contenteditable   (default input)
    type=<input type>          type attribute of #f (e.g. password)
    hostile=1                  site CSS tries to unmask #f
    swap=input                 replace #f with a copy holding its value on the
                               first input event (a hostile node swap)
    advance=1                  a second field #g; focus moves to it on input
    evil=<url>                 an iframe #evil with that src
    steal=focus,beforeinput,blur,input,keydown
                               move focus into #evil on those #f events
    react=1                    emulate React's controlled-input value tracker
    other=1                    a second plain input #other (paste target)
    plain=1                    a plain input #plain (clipboard control)
    autofocus=1                #f has autofocus, and takes focus whenever the
                               window gets it (autofocus alone is blocked in a
                               cross-origin iframe) — so text typed into this
                               document lands in #f
-->
<p id="lead">Fixture login page for the vibatchium vault tests. It reports what
landed in its own fields through the probe button below, so no value-reading
verb is needed.</p>
<button id="probe" type="button">probe</button>
<button id="toggle" type="button">show password</button>
<div id="slot"></div>
<pre id="out"></pre>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const slot = document.getElementById('slot');
  const kind = q.get('field') || 'input';
  let f;
  if (kind === 'textarea') f = document.createElement('textarea');
  else if (kind === 'select') {
    f = document.createElement('select');
    for (const v of ['', 'one', 'two']) {
      const o = document.createElement('option'); o.value = v; o.textContent = v || '-';
      f.appendChild(o);
    }
  } else if (kind === 'checkbox') {
    f = document.createElement('input'); f.type = 'checkbox';
  } else if (kind === 'contenteditable') {
    f = document.createElement('div'); f.contentEditable = 'true';
    f.style.minHeight = '30px'; f.style.border = '1px solid #000';
  } else {
    f = document.createElement('input');
    if (q.get('type')) f.setAttribute('type', q.get('type'));
  }
  f.id = 'f';
  f.setAttribute('autocomplete', 'off');
  f.style.fontSize = '28px';
  f.style.width = '420px';
  if (q.get('autofocus')) {
    f.autofocus = true;
    window.addEventListener('focus', () => f.focus());
  }
  slot.appendChild(f);

  for (const id of ['g', 'other', 'plain']) {
    if ((id === 'g' && q.get('advance')) || q.get(id)) {
      const e = document.createElement('input');
      e.id = id; e.setAttribute('autocomplete', 'off');
      slot.appendChild(e);
    }
  }

  if (q.get('hostile')) {
    document.getElementById('hostile').textContent =
      '#f{-webkit-text-security:none!important}';
  }

  // First write seen on #f: was the render mask already on?
  let maskedAtWrite = null;
  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'f' && e.target.value && maskedAtWrite === null) {
      maskedAtWrite = e.target.hasAttribute('data-vb-secret') ? 'yes' : 'no';
    }
  }, true);

  if (q.get('swap') === 'input') {
    f.addEventListener('input', () => {
      const n = document.createElement('input');
      n.id = 'f'; n.value = f.value;
      f.replaceWith(n);
    }, {once: true});
  }

  if (q.get('advance')) {
    f.addEventListener('input', () => document.getElementById('g').focus());
  }

  if (q.get('evil')) {
    const fr = document.createElement('iframe');
    fr.id = 'evil'; fr.src = q.get('evil');
    fr.style.width = '420px'; fr.style.height = '160px';
    document.body.appendChild(fr);
    for (const ev of (q.get('steal') || '').split(',').filter(Boolean)) {
      f.addEventListener(ev, () => { fr.focus(); }, true);
    }
  }

  // React's controlled input in miniature: the framework shadows the node's
  // own `value` property so programmatic writes update its tracker, and on
  // `input` it only accepts the value if it differs from the tracker. A write
  // that went through the page's `el.value = x` would therefore be ignored.
  const react = {state: '', setterCalls: 0, events: 0};
  if (q.get('react')) {
    const native = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    let tracked = '';
    Object.defineProperty(f, 'value', {
      configurable: true,
      get() { return native.get.call(this); },
      set(v) { react.setterCalls++; tracked = String(v); native.set.call(this, v); },
    });
    f.addEventListener('input', () => {
      react.events++;
      const cur = native.get.call(f);
      if (cur !== tracked) { tracked = cur; react.state = cur; }
    });
  }

  document.getElementById('toggle').addEventListener('click', () => {
    const el = document.getElementById('f');
    el.type = el.type === 'password' ? 'text' : 'password';
  });

  let probeRuns = 0;
  document.getElementById('probe').addEventListener('click', () => {
    const el = document.getElementById('f');
    const vals = {};
    for (const i of document.querySelectorAll('input, textarea, select')) {
      vals[i.id || i.tagName.toLowerCase()] = i.type === 'checkbox' ? String(i.checked) : i.value;
    }
    if (el && el.isContentEditable) vals.f = el.textContent;
    const snap = {
      vals,
      inputs: [...document.querySelectorAll('input')].map(i => i.value),
      sec: !!(el && el.hasAttribute('data-vb-secret')),
      ts: el ? getComputedStyle(el).webkitTextSecurity : null,
      maskedAtWrite,
      react,
      active: document.activeElement ? (document.activeElement.id || document.activeElement.tagName) : null,
      run: ++probeRuns,   // every probe's output differs, so the helper can tell a fresh run
    };
    const s = JSON.stringify(snap);
    document.title = 'p:' + s;
    document.getElementById('out').textContent = s;
  });
  // #probe is parsed before this script runs, so a click can land on a button
  // with no listener yet (an iframe can still be mid-parse). probe() waits for
  // this marker first.
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
